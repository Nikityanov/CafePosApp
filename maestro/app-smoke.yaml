# Тест интерфейса приложения, а не его соседа по эмулятору.
#
# smoke.yaml — самопроверка Maestro на стоковых Настройках (см. README), и она
# ничего не поймала бы: за сессию 2026-10-01/02 из приложения убрали поиск,
# кнопку «Обновить» со всех страниц, режим «Выбрать» и CSV из каталога.
#
# ДВА ОГРАНИЧЕНИЯ СОПОСТАВЛЕНИЯ, найденные экспериментом, а не догадкой.
# Оба стоят каждой строки комментария:
#
# 1. text: сопоставляется ПОЛНЫЙ текст элемента, а не подстрока. «Товары»
#    проходит, «Показать» — нет, хотя на экране написано «Показать удалённые».
#    Любую подстроку надо оборачивать: .*Показ.*
#
# 2. Букву «ё» не использовать. Полная строка с ней не сопоставляется, и
#    .*Показать удал.* тоже не спасает — по всей видимости, две нормализации
#    Unicode. Стоковый пример из README целиком ASCII, и это не совпадение.
#
# clearState намеренно НЕ задан: сброс уничтожил бы смену и историю заказов.
appId: com.companyname.cafeposapp
tags:
  - smoke
  - app
---
# ── Меню ──────────────────────────────────────────────────────────────────────
- launchApp
- extendedWaitUntil:
    visible: "Корзина"
    timeout: 30000
- assertVisible: "Меню"
- assertVisible: "Десерты"
- assertVisible: "Напитки"
# Поиска быть не должно: владелец решил, что позиций мало и скролла хватает.
- assertNotVisible: "Поиск блюда"
- assertNotVisible: "Закрыть"

# Раздел фильтрует список. Это теперь единственный способ найти блюдо, поэтому
# проверка не косметическая: сломать его значит убрать навигацию целиком.
- tapOn:
    text: "Напитки"
    index: 0
- extendedWaitUntil:
    visible: "Капучино"
    timeout: 10000
- assertVisible: "Американо"
- assertNotVisible: "Чизкейк"

- tapOn:
    text: "Все"
    index: 0
- extendedWaitUntil:
    visible: "Чизкейк"
    timeout: 10000

# ── Каталог: три кнопки, которые убрали по решению владельца ───────────────────
- tapOn:
    text: "More"
    index: 0
- tapOn:
    text: "Каталог"
    index: 0
- extendedWaitUntil:
    visible: ".*Показ.*"
    timeout: 15000
- assertVisible: "Разделы"
- assertVisible: "Модификаторы"
- assertVisible: "Ингредиенты"
- assertNotVisible: "Обновить"
- assertNotVisible: "Выбрать"
- assertNotVisible: "Поиск"

# ── Настройки: сюда переехал CSV ───────────────────────────────────────────────
- tapOn:
    text: "More"
    index: 0
- tapOn:
    text: "Настройки"
    index: 0
- extendedWaitUntil:
    visible: "Сохранить настройки"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: ".*Экспорт каталога.*"
    direction: DOWN
    timeout: 20000
# Импорт стоит под красной кнопкой восстановления, потому что оба перезаписывают
# рабочие данные. Многоточие в подписи не проверяем: это отдельный символ.
- scrollUntilVisible:
    element:
      text: ".*Импорт каталога.*"
    direction: DOWN
    timeout: 20000
- scrollUntilVisible:
    element:
      text: ".*Восстановить из копии.*"
    direction: DOWN
    timeout: 20000
- assertVisible: ".*Создать копию.*"

# ── Смена: здесь владелец увидел красный по серому ────────────────────────────
# Вкладки бьём по тексту, а не по координате: point "50%, 94%" не переключил
# вкладку на вложенной странице настроек, хотя на «Меню» та же точка работала.
- tapOn:
    text: "Смена"
    index: 0
- extendedWaitUntil:
    visible: "История заказов смены"
    timeout: 20000
- assertVisible: "Деньги"
- assertVisible: "Анализировать смену"
- assertNotVisible: "Обновить"

# ── Заказы: кнопки обновления здесь тоже нет ──────────────────────────────────
- tapOn:
    text: "Заказы"
    index: 0
- extendedWaitUntil:
    visible: "Готовятся"
    timeout: 20000
- assertVisible: ".*Ждут выдачи.*"
- assertNotVisible: "Обновить"

# Скриншот нужен для проверки цвета: assertTrue исполняется как JavaScript и
# пикселей не видит. Путь с каталогом, иначе Maestro кладёт файл в корень
# репозитория и тот попадает в git status.
- takeScreenshot: maestro/app-smoke-ok